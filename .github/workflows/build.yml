name: Construire l'APK Nox

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: SDK Android 36, NDK et CMake (moteur d'images)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null

      - name: ccache pour le moteur natif
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ccache > /dev/null
          {
            echo "NOX_CCACHE=1"
            echo "CCACHE_DIR=$HOME/.ccache"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_COMPILERCHECK=string:ndk-27.2.12479018"
            echo "CCACHE_SLOPPINESS=time_macros,include_file_mtime,include_file_ctime"
            echo "CCACHE_MAXSIZE=2G"
          } >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Tests des commandes directes et phrases spéciales
        run: |
          curl -sSLo json.jar https://repo1.maven.org/maven2/org/json/json/20240303/json-20240303.jar
          kotlinc -cp json.jar ci/commandes/*.kt app/src/main/java/com/application/nox/Commands.kt app/src/main/java/com/application/nox/MathEval.kt app/src/main/java/com/application/nox/Intents.kt app/src/main/java/com/application/nox/Emotion.kt app/src/main/java/com/application/nox/ResourcePolicy.kt -include-runtime -d commandes.jar 2>&1 | grep -v "^warning" || true
          java -cp commandes.jar:json.jar com.application.nox.TestCommandesKt

      - uses: gradle/actions/setup-gradle@v6

      - name: Compilation
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk Nox-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v7
        with:
          name: Nox-apk
          path: Nox-${{ github.run_number }}.apk

      - name: Publier la version (APK direct, sans ZIP)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: Nox build ${{ github.run_number }}
          body: APK compilé automatiquement depuis ${{ github.sha }}.
          files: Nox-${{ github.run_number }}.apk
          make_latest: true
