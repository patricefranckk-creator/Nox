name: Construire l'APK Nox

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: SDK Android 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Tests des commandes directes
        run: |
          curl -sSLo json.jar https://repo1.maven.org/maven2/org/json/json/20240303/json-20240303.jar
          kotlinc -cp json.jar ci/commandes/*.kt app/src/main/java/com/application/nox/Commands.kt app/src/main/java/com/application/nox/MathEval.kt -include-runtime -d commandes.jar 2>&1 | grep -v "^warning" || true
          java -cp commandes.jar:json.jar com.application.nox.TestCommandesKt

      - uses: gradle/actions/setup-gradle@v6

      - name: Compilation
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk Nox-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v7
        with:
          name: Nox-apk
          path: Nox-${{ github.run_number }}.apk

      - name: Publier la version (APK direct, sans ZIP)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: Nox build ${{ github.run_number }}
          body: APK compilé automatiquement depuis ${{ github.sha }}.
          files: Nox-${{ github.run_number }}.apk
          make_latest: true
